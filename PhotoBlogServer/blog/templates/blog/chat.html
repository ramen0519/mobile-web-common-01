{% extends 'blog/base.html' %}
{% load blog_tags %}

{% block content %}
    <h1>채팅</h1>
    <p>
        <span id="chat-status" class="label label-default">연결 중...</span>
        접속 중: <span id="chat-users"></span>
    </p>
    <div id="chat-log" class="chat-log">
        {% for message in chat_messages %}
        <div class="chat-message{% if message.user == user %} chat-me{% endif %}">
            <strong>{{ message.user|nickname }}</strong>
            <span class="chat-text">{{ message.text }}</span>
            <span class="date">{{ message.created_date|date:"H:i" }}</span>
        </div>
        {% endfor %}
    </div>
    <form id="chat-form" class="input-group">
        <input type="text" id="chat-input" class="form-control" maxlength="500" placeholder="메시지를 입력하세요" autocomplete="off">
        <span class="input-group-btn">
            <button type="submit" class="btn btn-primary">보내기</button>
        </span>
    </form>

    <script>
        const myId = {{ user.pk }};
        const log = document.getElementById('chat-log');
        const chatStatus = document.getElementById('chat-status');
        let socket = null;
        let leaving = false;

        function addLine(element) {
            log.appendChild(element);
            log.scrollTop = log.scrollHeight;
        }

        function addMessage(data) {
            const div = document.createElement('div');
            div.className = 'chat-message' + (data.user_id === myId ? ' chat-me' : '');
            const name = document.createElement('strong');
            name.textContent = data.nickname;
            const text = document.createElement('span');
            text.className = 'chat-text';
            text.textContent = ' ' + data.text + ' ';
            const time = document.createElement('span');
            time.className = 'date';
            time.textContent = data.time;
            div.append(name, text, time);
            addLine(div);
        }

        function addNotice(text) {
            const div = document.createElement('div');
            div.className = 'chat-notice';
            div.textContent = text;
            addLine(div);
        }

        // 웹소켓 연결 (https면 wss, http면 ws)
        function connect() {
            const scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
            socket = new WebSocket(scheme + location.host + '/ws/chat/');

            socket.onopen = function () {
                chatStatus.textContent = '연결됨';
                chatStatus.className = 'label label-success';
            };
            socket.onmessage = function (event) {
                const data = JSON.parse(event.data);
                document.getElementById('chat-users').textContent = data.users.join(', ');
                if (data.type === 'message') {
                    addMessage(data);
                } else if (data.type === 'join') {
                    addNotice(data.nickname + '님이 들어왔습니다.');
                } else if (data.type === 'leave') {
                    addNotice(data.nickname + '님이 나갔습니다.');
                }
            };
            // 연결이 끊기면 3초 뒤에 다시 연결 (페이지를 떠나는 중이면 하지 않음)
            socket.onclose = function () {
                if (leaving) {
                    return;
                }
                chatStatus.textContent = '연결 끊김 (다시 연결 중)';
                chatStatus.className = 'label label-danger';
                setTimeout(connect, 3000);
            };
        }
        connect();
        log.scrollTop = log.scrollHeight;

        // 다른 페이지로 이동하면 연결을 바로 닫아서 상대방에게 나감이 표시되게 함
        // (브라우저가 이전 페이지를 뒤로 가기용으로 잠시 남겨 둬도 연결이 살아 있지 않게)
        window.addEventListener('pagehide', function () {
            leaving = true;
            socket.close();
        });
        // 뒤로 가기로 다시 돌아오면 새로 연결
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) {
                leaving = false;
                connect();
            }
        });

        document.getElementById('chat-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const input = document.getElementById('chat-input');
            if (input.value.trim() === '' || socket.readyState !== WebSocket.OPEN) {
                return;
            }
            socket.send(JSON.stringify({text: input.value}));
            input.value = '';
        });
    </script>
{% endblock %}
