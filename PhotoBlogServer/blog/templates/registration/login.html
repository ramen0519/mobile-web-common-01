{% extends 'blog/base.html' %}

{% block content %}
    <h1>로그인</h1>
    {% for message in messages %}
    <p class="text-danger">{{ message }}</p>
    {% endfor %}
    <form method="POST" class="account-form clearfix">
        {% csrf_token %}
        {% if form.errors %}
        <p class="text-danger">아이디 또는 비밀번호가 맞지 않습니다.</p>
        {% endif %}
        <div class="form-group">
            <label for="id_username">아이디</label>
            <input type="text" name="username" id="id_username" class="form-control" value="{{ form.username.value|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="id_password">비밀번호</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="save btn btn-primary">로그인</button>
    </form>
    <a href="{% url 'kakao_login' %}" class="btn btn-block btn-kakao">카카오 로그인</a>
    <p>아직 회원이 아니면 <a href="{% url 'signup' %}">회원가입</a></p>
{% endblock %}
